[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-output-contract"
version = "0.1.1"
description = "Canonical OCR output contract + conformance harness shared by the OCR engine CLI family"
authors = [
    { name = "Ruben Fernandez-Fuertes", email = "fernandezfuertesruben@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ocr", "output-contract", "conformance", "metadata", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
]

# Zero runtime dependencies by design: this library operates on already-extracted
# page text + figure bytes. PDF parsing and model calls stay engine-side.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/r-uben/ocr-output-contract"
Repository = "https://github.com/r-uben/ocr-output-contract"
Issues = "https://github.com/r-uben/ocr-output-contract/issues"

[tool.hatch.build.targets.wheel]
packages = ["ocr_output_contract"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
